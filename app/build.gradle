plugins { id 'com.android.application' }
android {
    namespace 'com.tonyferlazzo.whostexting'
    compileSdk 35
    defaultConfig {
        applicationId 'com.tonyferlazzo.whostexting'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '0.3.2-self-test'
    }
    signingConfigs {
        release {
            def signingFile = System.getenv('WT_STORE_FILE')
            if (signingFile) {
                storeFile file(signingFile)
                storePassword System.getenv('WT_STORE_PASSWORD')
                keyAlias System.getenv('WT_KEY_ALIAS')
                keyPassword System.getenv('WT_KEY_PASSWORD')
                storeType 'PKCS12'
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
