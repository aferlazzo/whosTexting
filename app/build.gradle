plugins { id 'com.android.application' }
android {
    namespace 'com.tonyferlazzo.whostexting'
    compileSdk 35
    defaultConfig {
        applicationId 'com.tonyferlazzo.whostexting'
        minSdk 26
        targetSdk 35
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        versionCode 7
        versionName '0.3.3-current-notifications'
    }
    signingConfigs {
        release {
            def signingFile = System.getenv('WT_STORE_FILE')
            if (signingFile) {
                storeFile file(signingFile)
                storePassword System.getenv('WT_STORE_PASSWORD')
                keyAlias System.getenv('WT_KEY_ALIAS')
                keyPassword System.getenv('WT_KEY_PASSWORD')
                storeType 'PKCS12'
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'junit:junit:4.13.2'
}
