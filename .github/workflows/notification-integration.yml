name: Android notification delivery tests
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api: [35, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - name: Build emulator-only fixtures and instrumented tests
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :notification-fixture:assembleDebug
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test actual Android notification delivery
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          disable-animations: true
          script: |
            adb install app/build/outputs/apk/debug/app-debug.apk
            adb install app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb install notification-fixture/build/outputs/apk/debug/notification-fixture-debug.apk
            adb shell pm grant com.google.android.apps.messaging android.permission.POST_NOTIFICATIONS
            adb shell pm grant com.google.android.apps.messaging android.permission.WRITE_CONTACTS
            adb shell pm grant com.tonyferlazzo.whostexting android.permission.READ_CONTACTS
            adb shell cmd notification allow_listener com.tonyferlazzo.whostexting/com.tonyferlazzo.whostexting.MessagesListener
            adb shell am instrument -w -r com.tonyferlazzo.whostexting.test/androidx.test.runner.AndroidJUnitRunner | tee instrumentation-result.txt
            grep -E "OK \\([0-9]+ tests?\\)" instrumentation-result.txt
            adb pull /sdcard/Android/data/com.tonyferlazzo.whostexting/files/qa ui-evidence
      - name: Retain test evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notification-delivery-results-api-${{ matrix.api }}
          path: |
            instrumentation-result.txt
            ui-evidence/*.png
